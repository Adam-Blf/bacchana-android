version: 2

updates:
  # Actions are pinned to commit SHAs (see .github/workflows), so Dependabot is
  # the mechanism that keeps those pins fresh instead of letting them rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
