name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      # Le jar du wrapper est un BINAIRE commite. Son diff n'est pas lisible dans
      # l'interface de GitHub, donc une PR qui le remplace passe la revue humaine
      # sans que personne ne voie rien, puis s'execute a la prochaine etiquette
      # dans le job qui decode le keystore de signature. Une cle de signature
      # Android ne se change pas sans casser la mise a jour de tous les installes.
      #
      # `validate-wrappers` compare l'empreinte du jar a la liste des versions
      # publiees par Gradle. Ajoute le 2026-08-31, le jour ou ce jar a change.
      - name: Valider le wrapper Gradle
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Run core unit tests
        run: ./gradlew :core:test --console=plain

  build-and-upload:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    # Only job of the repo allowed to write: it publishes the GitHub release.
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      # Le jar du wrapper est un BINAIRE commite. Son diff n'est pas lisible dans
      # l'interface de GitHub, donc une PR qui le remplace passe la revue humaine
      # sans que personne ne voie rien, puis s'execute a la prochaine etiquette
      # dans le job qui decode le keystore de signature. Une cle de signature
      # Android ne se change pas sans casser la mise a jour de tous les installes.
      #
      # `validate-wrappers` compare l'empreinte du jar a la liste des versions
      # publiees par Gradle. Ajoute le 2026-08-31, le jour ou ce jar a change.
      - name: Valider le wrapper Gradle
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Decode keystore from base64
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        # The secret is passed through the environment, never interpolated into
        # the script body: ${{ }} expansion happens before the shell runs, so a
        # crafted value would be executed as shell code.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks

      - name: Build signed release AAB
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: ./gradlew :app:bundleRelease --console=plain
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build unsigned debug AAB for inspection (no secrets)
        if: ${{ env.HAS_KEYSTORE != 'true' }}
        run: ./gradlew :app:bundleDebug --console=plain

      - name: Upload to Play Console internal test track
        if: ${{ env.HAS_KEYSTORE == 'true' && env.HAS_PLAY_JSON == 'true' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.beloucif.bacchana
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Upload release AAB as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/
          retention-days: 30

      - name: Create Release on GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        with:
          draft: false
          prerelease: false
          files: app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f keystore.jks
